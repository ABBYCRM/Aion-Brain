name: apply-audit-fixes

on:
  push:
    branches:
      - agent/exhaustive-runtime-audit

permissions:
  contents: write

concurrency:
  group: apply-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exhaustive-runtime-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and unpack exact audited payload
        run: |
          cat .audit-payload/part-* > /tmp/aion-fixes.tar.gz
          echo 'f3005fc7e6a48e4d60edb6db7ddc3e4c6b57f371393d9c184db54a7d0c3fd53b  /tmp/aion-fixes.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/aion-fixes.tar.gz
          rm -rf data-real-* .audit-payload .github/workflows/apply-audit-fixes.yml
          rm -f package-lock.json
      - name: Generate portable lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Clean install
        run: npm ci --no-fund
      - name: Verify syntax, units, and runtime smoke
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden gateway runtime and verification'
          git push origin HEAD:agent/exhaustive-runtime-audit
