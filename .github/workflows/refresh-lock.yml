name: refresh-lock

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.head_ref == 'agent/exhaustive-runtime-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/exhaustive-runtime-audit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate portable lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Clean install
        run: npm ci --no-fund
      - name: Verify syntax and behavior
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'deps: refresh verified lockfile for supported runtimes'
          git push origin HEAD:agent/exhaustive-runtime-audit
