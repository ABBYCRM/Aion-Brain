name: ci

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check lib/auditor.js
          node --check lib/client.js
          node --check lib/router.js
          node --check lib/rules.js
          node --check lib/store.js
          node --check bin/audit.mjs
          node --check test/smoke.mjs
          node --check test/smoke-real.mjs
      - name: Hermetic smoke
        run: npm run smoke
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
